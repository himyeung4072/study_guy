<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P5 中文科考前溫習：供詞填充特訓系統（教師審訂版）</title>
<style>
  :root {
    --paper-bg: #fcfaf5;
    --ink: #1e242b;
    --ink-muted: #5a626a;
    --border-strong: #1e242b;
    --accent-primary: #1d4ed8;
    --accent-hover: #1e40af;
    --correct-green: #15803d;
    --correct-bg: #dcfce7;
    --wrong-red: #b91c1c;
    --wrong-bg: #fee2e2;
    --selected-bg: #dbeafe;
    --selected-border: #2563eb;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "PingFang HK", "Microsoft JhengHei", "Heiti TC", "Kaiti TC", serif;
    background-color: #e5e2dc;
    color: var(--ink);
    line-height: 1.65;
    padding: 16px;
  }

  .app-shell {
    max-width: 920px;
    margin: 0 auto;
  }

  /* 頂部控制列 */
  .top-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: #ffffff;
    padding: 12px 18px;
    border-radius: 8px;
    border: 2px solid var(--border-strong);
    margin-bottom: 16px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.06);
  }

  .brand-title {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .teacher-badge {
    font-size: 0.78rem;
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #f59e0b;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 700;
  }

  .nav-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn {
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 6px;
    border: 2px solid var(--border-strong);
    background: #fff;
    color: var(--ink);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover:not(:disabled) {
    background: #f1f5f9;
    transform: translateY(-1px);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--accent-primary);
    color: #fff;
    border-color: var(--accent-primary);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .btn-danger {
    background: var(--wrong-bg);
    color: var(--wrong-red);
    border-color: var(--wrong-red);
  }

  .btn-danger:hover:not(:disabled) {
    background: #fecaca;
  }

  /* 模擬香港小學試卷紙張 */
  .exam-paper {
    background: var(--paper-bg);
    border: 2px solid var(--border-strong);
    padding: 28px 32px;
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    position: relative;
  }

  .exam-header {
    border-bottom: 2px solid var(--border-strong);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }

  .exam-header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 8px;
  }

  .exam-code {
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.04em;
  }

  .student-meta {
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    gap: 18px;
  }

  .meta-line {
    border-bottom: 1px solid var(--border-strong);
    display: inline-block;
    min-width: 90px;
    text-align: center;
    padding: 0 6px;
  }

  .exam-scope {
    font-size: 1.05rem;
    font-weight: 800;
    padding-top: 4px;
  }

  .exam-instruction {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 14px 0;
    line-height: 1.5;
  }

  /* 分組進度導航列 */
  .group-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px dashed #94a3b8;
  }

  .group-tab {
    padding: 6px 12px;
    border: 1.5px solid var(--border-strong);
    background: #fff;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .group-tab.active {
    background: var(--ink);
    color: #fff;
  }

  .group-tab.done {
    border-color: var(--correct-green);
    background: var(--correct-bg);
    color: var(--correct-green);
  }

  .group-tab.done.active {
    background: var(--correct-green);
    color: #fff;
  }

  /* 仿試卷黑框雙行供詞表 */
  .word-bank-wrapper {
    position: sticky;
    top: 8px;
    z-index: 20;
    background: var(--paper-bg);
    padding: 6px 0 10px 0;
  }

  .section-label {
    font-size: 1.1rem;
    font-weight: 900;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .helper-tip {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent-primary);
  }

  .word-bank-box {
    border: 2.5px solid var(--border-strong);
    background: #ffffff;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .word-chip {
    padding: 8px 4px;
    font-size: 1.12rem;
    font-weight: 800;
    border: 1.5px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: all 0.12s ease;
    background: #f8fafc;
  }

  .word-chip:hover:not(.used) {
    border-color: var(--accent-primary);
    background: #eff6ff;
  }

  .word-chip.selected {
    background: var(--selected-bg);
    border-color: var(--selected-border);
    color: var(--accent-primary);
    box-shadow: 0 0 0 2px rgba(37,99,235,0.25);
    transform: scale(1.03);
  }

  .word-chip.used {
    color: #94a3b8;
    text-decoration: line-through;
    background: #f1f5f9;
    font-weight: 600;
  }

  /* 題目列表 */
  .questions-list {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .question-row {
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.95;
    padding: 10px 14px;
    border-radius: 6px;
    background: rgba(255,255,255,0.65);
    border: 1px solid #e2e8f0;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .q-num {
    font-weight: 900;
    min-width: 28px;
    flex-shrink: 0;
  }

  .q-content {
    flex: 1;
  }

  /* 填充橫線按鈕 */
  .blank-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 135px;
    padding: 0 12px;
    margin: 0 4px;
    border-bottom: 2px solid var(--border-strong);
    font-weight: 800;
    font-size: 1.15rem;
    color: var(--accent-primary);
    cursor: pointer;
    min-height: 34px;
    vertical-align: baseline;
    transition: all 0.15s ease;
    background: rgba(255,255,255,0.8);
  }

  .blank-slot:hover {
    background: #eff6ff;
  }

  .blank-slot.active-target {
    background: var(--selected-bg);
    border-bottom: 3px solid var(--selected-border);
    box-shadow: 0 2px 0 rgba(37,99,235,0.2);
  }

  .blank-slot.filled {
    color: #0f172a;
    background: #f8fafc;
  }

  .blank-slot.correct {
    color: var(--correct-green);
    border-bottom-color: var(--correct-green);
    background: var(--correct-bg);
  }

  .blank-slot.wrong {
    color: var(--wrong-red);
    border-bottom-color: var(--wrong-red);
    background: var(--wrong-bg);
    text-decoration: line-through;
  }

  .correction-tag {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 10px;
    font-size: 1rem;
    font-weight: 800;
    color: var(--correct-green);
    background: var(--correct-bg);
    border: 1px solid var(--correct-green);
    border-radius: 4px;
  }

  /* 小結算面板 */
  .group-summary-card {
    margin-top: 24px;
    padding: 20px;
    border: 2px solid var(--border-strong);
    background: #ffffff;
    border-radius: 8px;
  }

  .summary-title {
    font-size: 1.25rem;
    font-weight: 900;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 主頁選單卡片 */
  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 18px;
  }

  .practice-card {
    background: #ffffff;
    border: 2px solid var(--border-strong);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    transition: transform 0.15s ease;
  }

  .practice-card:hover {
    transform: translateY(-2px);
  }

  .card-title {
    font-size: 1.3rem;
    font-weight: 900;
  }

  .card-meta {
    font-size: 0.92rem;
    color: var(--ink-muted);
    font-weight: 600;
  }

  .badge-score {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-weight: 800;
    font-size: 0.9rem;
    background: #f1f5f9;
  }

  /* 錯題列表樣式 */
  .mistake-item {
    background: #fff;
    border: 1.5px solid #cbd5e1;
    border-left: 5px solid var(--wrong-red);
    padding: 14px 16px;
    border-radius: 6px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .footer-bar {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 2px solid var(--border-strong);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  @media (max-width: 680px) {
    .exam-paper {
      padding: 16px 14px;
    }
    .word-bank-box {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
    }
    .word-chip {
      font-size: 1rem;
      padding: 6px 2px;
    }
    .question-row {
      font-size: 1.05rem;
      padding: 8px 10px;
    }
  }
</style>
</head>

// 儲存 Key
const STORAGE_KEY_MISTAKES = "p5_chinese_fill_mistakes_v2";
const STORAGE_KEY_SCORES = "p5_chinese_fill_scores_v2";

// 狀態管理
let currentMode = "home"; // "home" | "practice" | "mistake_hub" | "mistake_quiz"
let currentPracticeIdx = 0; // 0 to 4 (練習一至五)
let currentGroupIdx = 0; // 0 to 5 (第一組至第六組)
let selectedWord = null;
let activeBlankIndex = null;

// 每個練習的作答紀錄: practiceState[groupIdx] = { questions: [], userAnswers: {}, submitted: false }
let practiceSession = [];
let mistakeQuizSession = null;

function loadMistakes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_MISTAKES);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveMistakes(list) {
  localStorage.setItem(STORAGE_KEY_MISTAKES, JSON.stringify(list));
  updateMistakeBadge();
}

function loadScores() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_SCORES);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveScore(practiceIdx, score, total) {
  const scores = loadScores();
  const prev = scores[practiceIdx];
  if (!prev || score >= prev.score) {
    scores[practiceIdx] = {
      score,
      total,
      date: new Date().toLocaleDateString("zh-HK")
    };
  }
  localStorage.setItem(STORAGE_KEY_SCORES, JSON.stringify(scores));
}

function updateMistakeBadge() {
  const badge = document.getElementById("mistakeCountBadge");
  if (badge) {
    badge.textContent = loadMistakes().length;
  }
}

// 決定性洗牌（讓每個練習內的題目順序與詞語框順序錯開，但固定可重現）
function seededShuffle(arr, seed) {
  const copy = [...arr];
  let s = seed;
  for (let i = copy.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// 建立指定練習 (0..4) 的 6 組資料
function initPracticeSession(practiceIdx) {
  currentPracticeIdx = practiceIdx;
  currentGroupIdx = 0;
  selectedWord = null;
  activeBlankIndex = null;

  practiceSession = VOCAB_GROUPS.map((groupItems, gIdx) => {
    const rawQuestions = groupItems.map((item, idx) => ({
      id: `P${practiceIdx + 1}_G${gIdx + 1}_W${idx}`,
      practiceIdx,
      groupIdx: gIdx,
      word: item.word,
      sentence: item.s[practiceIdx]
    }));

    // 供詞框詞語順序與題目順序分別洗牌
    const bankWords = seededShuffle(
      groupItems.map(x => x.word),
      (practiceIdx + 1) * 100 + gIdx * 17 + 7
    );
    const shuffledQuestions = seededShuffle(
      rawQuestions,
      (practiceIdx + 1) * 300 + gIdx * 31 + 13
    );

    return {
      groupIdx: gIdx,
      bankWords,
      questions: shuffledQuestions,
      userAnswers: {},
      submitted: false
    };
  });

  currentMode = "practice";
  render();
}

function goHome() {
  currentMode = "home";
  selectedWord = null;
  activeBlankIndex = null;
  render();
}

function render() {
  updateMistakeBadge();
  const main = document.getElementById("mainView");
  if (currentMode === "home") {
    renderHome(main);
  } else if (currentMode === "practice") {
    renderPracticePaper(main);
  } else if (currentMode === "mistake_hub") {
    renderMistakeHub(main);
  } else if (currentMode === "mistake_quiz") {
    renderMistakeQuiz(main);
  }
}

// 渲染句子（將 ____ 轉為可點擊橫線）
function formatSentenceHtml(qObj, qIndexInGroup, userAns, isSubmitted) {
  const parts = qObj.sentence.split("____");
  const isTarget = !isSubmitted && activeBlankIndex === qIndexInGroup;
  let slotClass = "blank-slot";
  if (isTarget) slotClass += " active-target";
  if (userAns) slotClass += " filled";

  let displayWord = userAns ? userAns : "（點此填詞）";
  let correctionHtml = "";

  if (isSubmitted) {
    if (userAns === qObj.word) {
      slotClass += " correct";
      displayWord = `${userAns} ✓`;
    } else {
      slotClass += " wrong";
      displayWord = userAns ? `${userAns} ✗` : "（未作答）✗";
      correctionHtml = `<span class="correction-tag">正確答案：${qObj.word}</span>`;
    }
  }

  const clickAttr = isSubmitted ? "" : `onclick="handleBlankClick(${qIndexInGroup})"`;

  return `
    ${parts[0]}<span class="${slotClass}" ${clickAttr}>${displayWord}</span>${parts[1] || ""}${correctionHtml}
  `;
}

        <div class="word-bank-box">
          ${bankHtml}
        </div>
      </div>

      <div class="questions-list">
        ${questionsHtml}
      </div>

      ${bottomSummaryHtml}
      ${fullReportHtml}
    </div>
  `;
}

// 點選上方供詞框的詞語
function handleWordClick(word) {
  const grp = practiceSession[currentGroupIdx];
  if (grp.submitted) return;

  // 若這個詞已經填在某一題，先把舊位置清掉或選取它
  if (activeBlankIndex !== null) {
    // 若其他題已用了這個詞，先移除舊題的該詞（確保每個選項只用一次）
    Object.keys(grp.userAnswers).forEach(k => {
      if (grp.userAnswers[k] === word) {
        delete grp.userAnswers[k];
      }
    });
    grp.userAnswers[activeBlankIndex] = word;
    selectedWord = null;

    // 自動跳去下一條未填的橫線
    let nextBlank = null;
    for (let i = 0; i < 12; i++) {
      const checkIdx = (activeBlankIndex + 1 + i) % 12;
      if (!grp.userAnswers[checkIdx]) {
        nextBlank = checkIdx;
        break;
      }
    }
    activeBlankIndex = nextBlank;
    render();
  } else {
    selectedWord = (selectedWord === word) ? null : word;
    render();
  }
}

// 點擊句子中的橫線
function handleBlankClick(qIdx) {
  const grp = practiceSession[currentGroupIdx];
  if (grp.submitted) return;

  if (selectedWord) {
    // 確保每個選項只用一次
    Object.keys(grp.userAnswers).forEach(k => {
      if (grp.userAnswers[k] === selectedWord) {
        delete grp.userAnswers[k];
      }
    });
    grp.userAnswers[qIdx] = selectedWord;
    selectedWord = null;
    activeBlankIndex = null;
  } else if (grp.userAnswers[qIdx]) {
    // 如果橫線已有詞語，點擊即清除並選中該格
    delete grp.userAnswers[qIdx];
    activeBlankIndex = qIdx;
  } else {
    activeBlankIndex = (activeBlankIndex === qIdx) ? null : qIdx;
  }
  render();
}

function switchGroup(idx) {
  currentGroupIdx = idx;
  selectedWord = null;
  activeBlankIndex = null;
  window.scrollTo({ top: 0, behavior: "smooth" });
  render();
}

function clearCurrentGroupAnswers() {
  const grp = practiceSession[currentGroupIdx];
  if (grp.submitted) return;
  grp.userAnswers = {};
  selectedWord = null;
  activeBlankIndex = null;
  render();
}

function retryCurrentGroup() {
  const grp = practiceSession[currentGroupIdx];
  grp.userAnswers = {};
  grp.submitted = false;
  selectedWord = null;
  activeBlankIndex = 0;
  render();
}

function submitCurrentGroup() {
  const grp = practiceSession[currentGroupIdx];
  const filledCount = Object.keys(grp.userAnswers).filter(k => grp.userAnswers[k]).length;
  if (filledCount < 12) {
    const ok = confirm(`本組還有 ${12 - filledCount} 題未填寫，確定要現在提交並批改嗎？`);
    if (!ok) return;
  }

  grp.submitted = true;
  selectedWord = null;
  activeBlankIndex = null;

  // 記錄錯題至 localStorage
  const mistakes = loadMistakes();
  const existingMap = new Map(mistakes.map(m => [m.id, m]));

  grp.questions.forEach((q, qIdx) => {
    const userAns = grp.userAnswers[qIdx] || "";
    if (userAns !== q.word) {
      existingMap.set(q.id, {
        id: q.id,
        practiceIdx: q.practiceIdx,
        groupIdx: q.groupIdx,
        word: q.word,
        sentence: q.sentence,
        lastWrongAns: userAns || "（未作答）",
        timestamp: Date.now()
      });
    }
  });

  saveMistakes(Array.from(existingMap.values()));
  render();
}

function scrollToFullReport() {
  const el = document.getElementById("fullReportSection");
  if (el) el.scrollIntoView({ behavior: "smooth" });
}

// ================= 錯題溫習專區 =================
function openMistakeCenter() {
  currentMode = "mistake_hub";
  selectedWord = null;
  activeBlankIndex = null;
  render();
}

function renderMistakeHub(container) {
  const mistakes = loadMistakes();
  const chineseNums = ["一", "二", "三", "四", "五"];

  if (mistakes.length === 0) {
    container.innerHTML = `
      <div class="exam-paper" style="text-align:center;padding:48px 24px;">
        <h2 style="font-size:1.5rem;margin-bottom:12px;">🎉 目前沒有任何錯題記錄！</h2>
        <p style="color:var(--ink-muted);margin-bottom:24px;">
          你在練習中做錯的題目會自動儲存在這裏，方便考前重點重溫。
        </p>
        <button class="btn btn-primary" onclick="goHome()">🏠 返回練習目錄</button>
      </div>
    `;
    return;
  }

  let listHtml = "";
  mistakes.forEach((m, idx) => {
    const highlightedSentence = m.sentence.replace(
      "____",
      `<strong style="color:var(--correct-green);border-bottom:2px solid var(--correct-green);padding:0 6px;">${m.word}</strong>`
    );
    listHtml += `
      <div class="mistake-item">
        <div style="flex:1;">
          <div style="font-size:0.85rem;color:var(--ink-muted);font-weight:700;margin-bottom:4px;">
            來源：練習${chineseNums[m.practiceIdx]}（第 ${m.groupIdx + 1} 組） ｜ 上次誤填：<span style="color:var(--wrong-red);text-decoration:line-through;">${m.lastWrongAns}</span>
          </div>
          <div style="font-size:1.1rem;font-weight:600;">
            ${idx + 1}. ${highlightedSentence}
          </div>
        </div>
        <button class="btn" onclick="removeSingleMistake('${m.id}')" title="已掌握，從錯題簿移除">
          ✅ 已掌握移除
        </button>
      </div>
    `;
  });

  container.innerHTML = `
    <div class="exam-paper">
      <div class="exam-header">
        <div class="exam-header-top">
          <div class="exam-code">📕 錯題溫習專區（只顯示曾經做錯的題目）</div>
          <div>
            <span class="badge-score" style="background:var(--wrong-bg);color:var(--wrong-red);">
              累積錯題：${mistakes.length} 題
            </span>
          </div>
        </div>
        <div class="exam-scope">你可以先在下方溫習正確句子，然後點擊「開始錯題重測」進行供詞填充小測驗！</div>
      </div>

      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
        <button class="btn btn-primary" onclick="startMistakeQuiz()">
          ✍️ 開始錯題重測（只測這 ${mistakes.length} 題）
        </button>
        <button class="btn btn-danger" onclick="clearAllMistakes()">
          🗑️ 清空全部錯題記錄
        </button>
      </div>

      <div>
        ${listHtml}
      </div>
    </div>
  `;
}

function removeSingleMistake(id) {
  const list = loadMistakes().filter(m => m.id !== id);
  saveMistakes(list);
  render();
}

function clearAllMistakes() {
  if (!confirm("確定要清空全部錯題記錄嗎？")) return;
  saveMistakes([]);
  render();
}

// 啟動錯題重測（每最多 12 題為一組，確保不重複供詞）
function startMistakeQuiz() {
  const mistakes = loadMistakes();
  if (mistakes.length === 0) return;

  // 為確保同一組內不會出現重複的正確答案詞語，將相同詞語分開到不同組
  const groups = [];
  mistakes.forEach(m => {
    let placed = false;
    for (const g of groups) {
      if (g.length < 12 && !g.some(x => x.word === m.word)) {
        g.push(m);
        placed = true;
        break;
      }
    }
    if (!placed) {
      groups.push([m]);
    }
  });

  // 如果某組少於 6 個詞語，從同組詞庫隨機補入干擾詞（或只顯示該組錯題詞語）
  mistakeQuizSession = groups.map((gItems, idx) => {
    const words = gItems.map(x => x.word);
    const bankWords = seededShuffle(words, Date.now() + idx * 19);
    return {
      groupIdx: idx,
      bankWords,
      questions: gItems,
      userAnswers: {},
      submitted: false
    };
  });

  currentGroupIdx = 0;
  selectedWord = null;
  activeBlankIndex = 0;
  currentMode = "mistake_quiz";
  render();
}

function renderMistakeQuiz(container) {
  const grp = mistakeQuizSession[currentGroupIdx];
  const isSubmitted = grp.submitted;
  const totalGroups = mistakeQuizSession.length;
  const usedWordsSet = new Set(Object.values(grp.userAnswers).filter(Boolean));

  let tabsHtml = "";
  mistakeQuizSession.forEach((g, idx) => {
    let cls = "group-tab";
    if (idx === currentGroupIdx) cls += " active";
    if (g.submitted) cls += " done";
    tabsHtml += `<button class="${cls}" onclick="switchMistakeGroup(${idx})">錯題第 ${idx + 1} 組 (${g.questions.length}題)</button>`;
  });

  let bankHtml = "";
  grp.bankWords.forEach(w => {
    const isUsed = usedWordsSet.has(w);
    const isSelected = !isSubmitted && selectedWord === w;
    let cls = "word-chip";
    if (isUsed) cls += " used";
    if (isSelected) cls += " selected";
    const clickAttr = isSubmitted ? "" : `onclick="handleMistakeWordClick('${w}')"`;
    bankHtml += `<div class="${cls}" ${clickAttr}>${w}</div>`;
  });

  let questionsHtml = "";
  grp.questions.forEach((qObj, qIdx) => {
    const ans = grp.userAnswers[qIdx] || "";
    const parts = qObj.sentence.split("____");
    const isTarget = !isSubmitted && activeBlankIndex === qIdx;
    let slotClass = "blank-slot";
    if (isTarget) slotClass += " active-target";
    if (ans) slotClass += " filled";

    let displayWord = ans ? ans : "（點此填詞）";
    let correctionHtml = "";

    if (isSubmitted) {
      if (ans === qObj.word) {
        slotClass += " correct";
        displayWord = `${ans} ✓`;
      } else {
        slotClass += " wrong";
        displayWord = ans ? `${ans} ✗` : "（未作答）✗";
        correctionHtml = `<span class="correction-tag">正確答案：${qObj.word}</span>`;
      }
    }

    const clickAttr = isSubmitted ? "" : `onclick="handleMistakeBlankClick(${qIdx})"`;

    questionsHtml += `
      <div class="question-row">
        <div class="q-num">${qIdx + 1}.</div>
        <div class="q-content">
          ${parts[0]}<span class="${slotClass}" ${clickAttr}>${displayWord}</span>${parts[1] || ""}${correctionHtml}
        </div>
      </div>
    `;
  });

  let footerHtml = "";
  if (!isSubmitted) {
    footerHtml = `
      <div class="footer-bar">
        <button class="btn" onclick="openMistakeCenter()">⬅️ 返回錯題列表</button>
        <button class="btn btn-primary" onclick="submitMistakeGroup()">✅ 提交本組錯題重測</button>
      </div>
    `;
  } else {
    const correctIds = [];
    grp.questions.forEach((q, qi) => {
      if (grp.userAnswers[qi] === q.word) correctIds.push(q.id);
    });

    footerHtml = `
      <div class="group-summary-card">
        <div class="summary-title">
          <span>📋 錯題重測結果：答對 ${correctIds.length} / ${grp.questions.length} 題</span>
        </div>
        <p style="font-size:0.95rem;color:var(--ink-muted);margin-bottom:14px;">
          你可以選擇把今次成功答對的 ${correctIds.length} 題從錯題簿中移除，或者保留下來繼續反覆練習。
        </p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          ${correctIds.length > 0 ? `<button class="btn btn-primary" onclick="removeCorrectFromMistakeBook()">🌟 將答對的 ${correctIds.length} 題移出錯題簿</button>` : ""}
          ${currentGroupIdx < totalGroups - 1 ? `<button class="btn" onclick="switchMistakeGroup(${currentGroupIdx + 1})">➡️ 下一組錯題</button>` : ""}
          <button class="btn" onclick="openMistakeCenter()">📕 返回錯題溫習主頁</button>
        </div>
      </div>
    `;
  }

  container.innerHTML = `
    <div class="exam-paper">
      <div class="exam-header">
        <div class="exam-header-top">
          <div class="exam-code">📕 錯題溫習重測卷（只抽出曾做錯的題目）</div>
        </div>
      </div>

      <div class="group-tabs">
        ${tabsHtml}
      </div>

      <div class="word-bank-wrapper">
        <div class="section-label">
          <span>供詞框（每個選項只能用一次）</span>
        </div>
        <div class="word-bank-box">
          ${bankHtml}
        </div>
      </div>

      <div class="questions-list">
        ${questionsHtml}
      </div>

      ${footerHtml}
    </div>
  `;
}

function switchMistakeGroup(idx) {
  currentGroupIdx = idx;
  selectedWord = null;
  activeBlankIndex = 0;
  render();
}

function handleMistakeWordClick(word) {
  const grp = mistakeQuizSession[currentGroupIdx];
  if (grp.submitted) return;

  if (activeBlankIndex !== null) {
    Object.keys(grp.userAnswers).forEach(k => {
      if (grp.userAnswers[k] === word) delete grp.userAnswers[k];
    });
    grp.userAnswers[activeBlankIndex] = word;
    selectedWord = null;

    let nextBlank = null;
    const len = grp.questions.length;
    for (let i = 0; i < len; i++) {
      const checkIdx = (activeBlankIndex + 1 + i) % len;
      if (!grp.userAnswers[checkIdx]) {
        nextBlank = checkIdx;
        break;
      }
    }
    activeBlankIndex = nextBlank;
    render();
  } else {
    selectedWord = (selectedWord === word) ? null : word;
    render();
  }
}

function handleMistakeBlankClick(qIdx) {
  const grp = mistakeQuizSession[currentGroupIdx];
  if (grp.submitted) return;

  if (selectedWord) {
    Object.keys(grp.userAnswers).forEach(k => {
      if (grp.userAnswers[k] === selectedWord) delete grp.userAnswers[k];
    });
    grp.userAnswers[qIdx] = selectedWord;
    selectedWord = null;
    activeBlankIndex = null;
  } else if (grp.userAnswers[qIdx]) {
    delete grp.userAnswers[qIdx];
    activeBlankIndex = qIdx;
  } else {
    activeBlankIndex = qIdx;
  }
  render();
}

function submitMistakeGroup() {
  const grp = mistakeQuizSession[currentGroupIdx];
  grp.submitted = true;
  selectedWord = null;
  activeBlankIndex = null;
  render();
}

function removeCorrectFromMistakeBook() {
  const grp = mistakeQuizSession[currentGroupIdx];
  const correctIds = new Set();
  grp.questions.forEach((q, qi) => {
    if (grp.userAnswers[qi] === q.word) correctIds.add(q.id);
  });

  const remaining = loadMistakes().filter(m => !correctIds.has(m.id));
  saveMistakes(remaining);
  openMistakeCenter();
}

// 初始化啟動
render();
</script>
